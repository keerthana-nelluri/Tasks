<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="bg-white rounded-3 p-4 shadow col-12 col-sm-10 col-md-6 col-lg-4">
    <h3 class="fw-bold text-dark text-center mb-4">Student Registration</h3>
    <form>
      <div class="mb-3 text-start">
        <label for="studentName" class="form-label fw-bold text-dark small">Student Name</label>
        <input type="text" id="studentName" class="form-control py-2" placeholder="Enter your name" required>
      </div>
      <div class="mb-3 text-start">
        <label for="mobileNumber" class="form-label fw-bold text-dark small">Mobile Number</label>
        <input type="tel" id="mobileNumber" class="form-control py-2" placeholder="Enter mobile number" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mt-2">Register</button>
    </form>
  </div>

  <script type="application/json" id="form-schema">
    {
      "title": "Student Registration",
      "fields": [
        {
          "label": "Student Name",
          "type": "text",
          "id": "studentName",
          "placeholder": "Enter your name",
          "required": true
        },
        {
          "label": "Mobile Number",
          "type": "tel",
          "id": "mobileNumber",
          "placeholder": "Enter mobile number",
          "required": true
        }
      ],
      "submitButtonText": "Register"
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
