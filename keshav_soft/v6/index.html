<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/keshavsoft/json-to-tag@main/index.js"></script>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="bg-white rounded-3 p-4 shadow col-12 col-sm-10 col-md-6 col-lg-4" id="formContainer"></div>

  <script>
    const schema = {
      tag: "div",
      children: [
        {
          tag: "h3",
          class: "fw-bold text-dark text-center mb-4",
          children: "Student Registration"
        },
        {
          tag: "form",
          children: [
            {
              tag: "div",
              class: "mb-3 text-start",
              children: [
                {
                  tag: "label",
                  for: "studentName",
                  class: "form-label fw-bold text-dark small",
                  children: "Student Name"
                },
                {
                  tag: "input",
                  type: "text",
                  id: "studentName",
                  class: "form-control py-2",
                  placeholder: "Enter your name",
                  required: true
                }
              ]
            },
            {
              tag: "div",
              class: "mb-3 text-start",
              children: [
                {
                  tag: "label",
                  for: "mobileNumber",
                  class: "form-label fw-bold text-dark small",
                  children: "Mobile Number"
                },
                {
                  tag: "input",
                  type: "tel",
                  id: "mobileNumber",
                  class: "form-control py-2",
                  placeholder: "Enter mobile number",
                  required: true
                }
              ]
            },
            {
              tag: "button",
              type: "submit",
              class: "btn btn-primary w-100 py-2 fw-semibold rounded-3 mt-2",
              children: "Register"
            }
          ]
        }
      ]
    };
    document.getElementById('formContainer').appendChild(jsonToTag(schema));
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
