<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-primary bg-gradient min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="bg-white rounded-5 p-4 p-sm-5 text-center shadow-lg col-12 col-sm-10 col-md-6 col-lg-4">
    
    <!-- Top Mortarboard Icon -->
    <div class="bg-primary bg-gradient text-white rounded-4 d-inline-flex align-items-center justify-content-center p-3 mb-4 shadow">
      <i class="bi bi-mortarboard-fill display-5"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">Student Registration</h3>
    <p class="text-secondary small mb-4">Enter your details to get started</p>
    <form>
      <div class="text-start mb-3">
        <label class="form-label fw-semibold text-dark small mb-1">Student Name</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-primary">
            <i class="bi bi-person-fill fs-5"></i>
          </span>
          <input type="text" class="form-control border-start-0 py-2" placeholder="Enter your full name" required>
        </div>
      </div>
      <div class="text-start mb-4">
        <label class="form-label fw-semibold text-dark small mb-1">Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-primary">
            <i class="bi bi-phone-fill fs-5"></i>
          </span>
          <input type="tel" class="form-control border-start-0 py-2" placeholder="Enter mobile number" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary bg-gradient w-100 py-2 rounded-3 fw-semibold mb-3 shadow-sm">
        Register Now &rarr;
      </button>
    </form>
    <div class="text-secondary small">
      Simple &bull; Fast &bull; Secure
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
