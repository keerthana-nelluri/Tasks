<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="bg-white rounded-3 p-4 shadow col-12 col-sm-10 col-md-6 col-lg-4" id="formContainer"></div>

  <script>
    const formData = {
      "title": "Student Registration",
      "fields": [
        {
          "label": "Student Name",
          "type": "text",
          "id": "studentName",
          "placeholder": "Enter your name"
        },
        {
          "label": "Mobile Number",
          "type": "tel",
          "id": "mobileNumber",
          "placeholder": "Enter mobile number"
        }
      ],
      "buttonText": "Register"
    };

    function renderFormFromJSON(data) {
      let htmlContent = `<h3 class="fw-bold text-dark text-center mb-4">${data.title}</h3><form>`;

      data.fields.forEach(field => {
        htmlContent += `
          <div class="mb-3 text-start">
            <label for="${field.id}" class="form-label fw-bold text-dark small">${field.label}</label>
            <input type="${field.type}" id="${field.id}" class="form-control py-2" placeholder="${field.placeholder}" required>
          </div>
        `;
      });

      htmlContent += `
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mt-2">
          ${data.buttonText}
        </button>
      </form>`;

      document.getElementById('formContainer').innerHTML = htmlContent;
    }

    renderFormFromJSON(formData);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
